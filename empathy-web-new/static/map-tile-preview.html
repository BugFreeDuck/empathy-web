<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Empathy map tile preview</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<style>
			:root {
				--sand: #f3ebe3;
				--ink: #2c2420;
				--mute: #7a6a60;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: Georgia, 'Times New Roman', serif;
				background: var(--sand);
				color: var(--ink);
			}
			header {
				padding: 1.25rem 1.5rem 0.5rem;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
				font-weight: 500;
			}
			p {
				margin: 0.35rem 0 0;
				color: var(--mute);
				font-size: 0.95rem;
			}
			.grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 1rem;
				padding: 1rem 1.5rem 2rem;
			}
			.card {
				background: #fff;
				border: 1px solid #e2d6cc;
				border-radius: 1.25rem;
				overflow: hidden;
			}
			.card h2 {
				margin: 0;
				padding: 0.85rem 1rem 0.15rem;
				font-size: 1.05rem;
				font-weight: 500;
			}
			.card .meta {
				padding: 0 1rem 0.65rem;
				font-size: 0.8rem;
				color: var(--mute);
			}
			.map {
				height: 280px;
				width: 100%;
			}
			/* Current production grade on OSM */
			.map.graded .leaflet-tile-pane {
				filter: grayscale(0.85) sepia(0.22) contrast(0.92) brightness(1.05);
			}
			.pin {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				background: #de6262;
				border: 2px solid #fff;
				box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
			}
			@media (max-width: 900px) {
				.grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Empathy contact map — tile previews</h1>
			<p>Eitminų g. 20, Vilnius · zoom 15 · same pin treatment</p>
		</header>
		<div class="grid" id="grid"></div>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script>
			const center = [54.739203569487714, 25.215930313233716];
			const layers = [
				{
					id: 'osm-graded',
					title: '1. Current — OSM + CSS grade',
					meta: 'In production now',
					url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
					attr: '© OpenStreetMap',
					graded: true,
					maxZoom: 19
				},
				{
					id: 'esri-gray',
					title: '2. Esri World Gray Canvas',
					meta: 'Best no-key muted match · no CSS filter',
					url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
					attr: 'Tiles © Esri',
					graded: false,
					maxZoom: 16,
					labels:
						'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'
				},
				{
					id: 'osm-raw',
					title: '3. OSM Standard (raw)',
					meta: 'No filter — full colour',
					url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
					attr: '© OpenStreetMap',
					graded: false,
					maxZoom: 19
				},
				{
					id: 'esri-street',
					title: '4. Esri World Street Map',
					meta: 'Colour street basemap · no key',
					url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
					attr: 'Tiles © Esri',
					graded: false,
					maxZoom: 19
				},
				{
					id: 'hot',
					title: '5. OSM Humanitarian (HOT)',
					meta: 'No key · brighter OSM variant',
					url: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
					attr: '© OSM, HOT',
					graded: false,
					maxZoom: 19
				},
				{
					id: 'imagery',
					title: '6. Esri World Imagery',
					meta: 'Satellite · no key',
					url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
					attr: 'Tiles © Esri',
					graded: false,
					maxZoom: 19
				}
			];

			const grid = document.getElementById('grid');
			const pin = L.divIcon({
				className: '',
				html: '<div class="pin"></div>',
				iconSize: [14, 14],
				iconAnchor: [7, 7]
			});

			for (const layer of layers) {
				const card = document.createElement('article');
				card.className = 'card';
				card.innerHTML = `<h2>${layer.title}</h2><div class="meta">${layer.meta}</div><div class="map${layer.graded ? ' graded' : ''}" id="${layer.id}"></div>`;
				grid.appendChild(card);

				const map = L.map(layer.id, {
					center,
					zoom: 15,
					zoomControl: false,
					attributionControl: true,
					scrollWheelZoom: false,
					dragging: false
				});

				L.tileLayer(layer.url, {
					attribution: layer.attr,
					maxZoom: layer.maxZoom,
					subdomains: 'abc'
				}).addTo(map);

				if (layer.labels) {
					L.tileLayer(layer.labels, {
						attribution: '',
						maxZoom: layer.maxZoom
					}).addTo(map);
				}

				L.marker(center, { icon: pin }).addTo(map);
				requestAnimationFrame(() => map.invalidateSize());
			}
		</script>
	</body>
</html>
