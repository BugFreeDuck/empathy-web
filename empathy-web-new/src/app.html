<!doctype html>
<html lang="lt">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#fdf7f3" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Marcellus&family=Montserrat:wght@900&family=Red+Hat+Display:ital,wght@0,300..700;1,300..700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply saved language before first paint to avoid a flash of LT.
			try {
				var lang = localStorage.getItem('empathy-locale');
				if (lang === 'en' || lang === 'ru' || lang === 'lt') {
					document.documentElement.lang = lang;
				}
			} catch (e) {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
