<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#fdf7f3" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48x48.png" />
		<link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/favicon-96x96.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon-192x192.png" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Marcellus&family=Montserrat:wght@900&family=Red+Hat+Display:ital,wght@0,300..700;1,300..700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZD0EVFQHXX"></script>
	<script>
		window.dataLayer = window.dataLayer || [];

		function gtag() {
			dataLayer.push(arguments);
		}

		gtag('js', new Date());

		gtag('config', 'G-ZD0EVFQHXX');
	</script>

	<!-- Google Ads lead-form conversion -->
	<script>
		function gtag_report_conversion(url) {
			var callback = function () {
				if (typeof url != 'undefined') {
					window.location = url;
				}
			};
			gtag('event', 'conversion', {
				send_to: 'AW-18480618282/BwCkCNyXpYkdEKq2n-xE',
				value: 1.0,
				currency: 'EUR',
				event_callback: callback
			});
			return false;
		}
	</script>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
